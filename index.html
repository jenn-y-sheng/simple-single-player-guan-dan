<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guan Dan</title>
    <link rel="stylesheet" href="styles/table.css">
    <link rel="stylesheet" href="styles/cards.css">
  </head>
  <body>
    <main id="game-container">
      <div id="player-top" class="player-area opponent">player top</div>
      <div id="player-left" class="player-area opponent">player left</div>
      <div id="player-right" class="player-area opponent">player right</div>

      <div id="center-table">
        <div id="trick-pile"></div>
        <p id="trick-info"></p> 
      </div>

      <div id="player-bottom" class="player-area human">
        <div id="hand-container"></div>
        
        <div id="action-bar">
          <button id="button-pass" class="action-button">Pass</button>
          <button id="button-play" class="action-button">Play Cards</button>
        </div>
      </div>
    </main>
    <script src="scripts/ui.js" type="module"></script>
  </body>
</html>
