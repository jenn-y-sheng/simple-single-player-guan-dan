<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guan Dan</title>
    <link rel="stylesheet" href="styles/table.css">
    <link rel="stylesheet" href="styles/cards.css">
  </head>
  <body>
    <div id="levels-container">
      <div id="ui-current-level">Currently playing at Level </div>
      <div id="ui-team1-level">Team 1 Level: </div>
      <div id="ui-team2-level">Team 2 Level: </div>
    </div>

    <div id="victory-banner">
      <h1 id="victory-title">TEAM X WINS!</h1>
      <p id="victory-subtitle">Promoted Y Level(s)!</p>
    </div>

    <main id="game-container">
      <div id="player-top" class="player-area opponent">
        <div id="count-top" class="card-count"></div>
      </div>
      <div id="player-left" class="player-area opponent">
        <div id="count-left" class="card-count"></div>
      </div>
      <div id="player-right" class="player-area opponent">
        <div id="count-right" class="card-count"></div>
      </div>

      <div id="center-table">
        <p id="trick-player"></p>
        <div id="trick-pile"></div>
        <p id="trick-info"></p> 
      </div>

      <div id="player-bottom" class="player-area human">
        <div id="hand-container"></div>
        
        <div id="action-bar">
          <button id="button-pass" class="action-button">Pass</button>
          <button id="button-play" class="action-button">Play Cards</button>

          <button id="button-autoplay" class="action-button">Autoplay: OFF</button>

          <button id="button-next-round" class="action-button">Start Next Round</button>
          <div id="count-bottom" class="card-count"></div>
        </div>
      </div>
    </main>
    <script src="scripts/ui.js" type="module"></script>
  </body>
</html>
